version: '3.8'

services:
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  api:
    build: ./GFST-BACKEND
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./GFST-BACKEND:/app

  frontend:
    build: ./GFST-FRONTEND
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./GFST-FRONTEND:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pg_data: